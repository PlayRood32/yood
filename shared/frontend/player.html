<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yood Native Player</title><style>
html,body{margin:0;height:100%;background:#0f0f0f;color:#f1f1f1;font:14px system-ui, sans-serif}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#212121}#title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}#status{color:#aaa;font-size:12px}main{display:flex;align-items:center;justify-content:center;flex:1;min-height:0}video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}button{background:#303030;border:1px solid #666;color:#fff;border-radius:4px;padding:4px 9px;cursor:pointer}button[disabled]{opacity:.5;cursor:default}input[type=range]{accent-color:#3ea6ff;cursor:pointer}footer{display:flex;flex-direction:column;gap:8px;padding:10px 14px;background:#181818;border-top:1px solid #333}.bar-row{display:flex;align-items:center;gap:12px}#timeline{flex:1}.controls{display:flex;align-items:center;gap:10px}#time{font-variant-numeric:tabular-nums;color:#aaa;white-space:nowrap;min-width:118px}#stats{color:#aaa;font-size:12px;white-space:nowrap}
</style></head><body><header><span id="title">Yood Native Player</span><span id="status">Loading…</span><span id="stats">—</span><label for="speed">Speed</label><select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="pip" type="button">Picture-in-picture</button><button id="fullscreen" type="button">Fullscreen</button></header><main><video id="player" controls playsinline></video></main><footer><div class="bar-row"><input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek"><span id="time">0:00 / 0:00</span></div><div class="controls"><button id="mute" type="button">Mute</button><label for="volume">Volume</label><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></div></footer><script type="module" src="./player.js"></script></body></html>
