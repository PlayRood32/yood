[package]
name = "yood"
version = "1.0.0"
description = "A lightweight, private YouTube desktop application"
authors = ["Yood contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"
build = "build.rs"

[lib]
name = "yood_lib"
crate-type = ["rlib"]

[[bin]]
name = "yood"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["protocol-asset"] }
tauri-plugin-deep-link = "2.4"
tauri-plugin-single-instance = "2.4"
adblock = { version = "0.13.2", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "sync", "time"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
url = { version = "2.5", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
fs2 = "0.4"
directories = "6.0"
keyring = "3.6"
regex = "1.11"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
which = "8.0"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = true
